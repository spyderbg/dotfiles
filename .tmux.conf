set -g mouse on
set -g default-terminal "tmux-256color"
set -g terminal-overrides ",xterm-256color:RGB"
setw -g mode-keys vi
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# Enable tmux to pass selections to the external OS clipboard
set -s set-clipboard on

# Tell tmux to use xclip when copying text
set -s copy-command 'xclip -in -selection clipboard'

# Fix standard Vim/Tmux copy mode bindings to use this pipeline
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard"
bind-key -T copy-mode y send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard"

# Renumber windows sequentially when one is closed
set -g renumber-windows on
